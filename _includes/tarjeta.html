  <a class="card{% unless include.post.portada %} no-img{% endunless %}" href="{{ include.post.url }}">
   {% if include.post.portada %}<div class="card-img" style="background-image:url('{{ include.post.portada }}')"></div>{% endif %}
   <div class="card-body">
    <span class="label">{% if include.post.lugar %}{{ include.post.lugar }} · {% endif %}{{ include.post.date | date: "%d/%m/%Y" }}</span>
    <h3>{{ include.post.title }}</h3>
    {% if include.post.resumen %}<p>{{ include.post.resumen }}</p>{% endif %}
   </div>
  </a>
