<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page.layout == 'post' %}{{ page.title }} · {% endif %}Blog · Marie Peachx</title>
<meta name="description" content="{{ page.resumen | default: page.description | default: site.description | strip_html | escape }}">
<meta name="theme-color" content="#f4efe6">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:title" content="{% if page.layout == 'post' %}{{ page.title | escape }}{% else %}Blog · Marie Peachx{% endif %}">
<meta property="og:description" content="{{ page.resumen | default: site.description | strip_html | escape }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
{% if page.portada %}<meta property="og:image" content="{{ page.portada | absolute_url }}">{% endif %}
<link rel="icon" href="/links/avatar.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..600,100&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/blog.css?v={{ site.time | date: '%s' }}">
</head>
<body>
<header class="site-header"><div class="wrap">
 <a class="brand" href="/">Marie Peachx</a>
 <nav aria-label="Principal"><a href="/blog/"{% if page.categoria != 'curiosidades' and page.url != '/blog/curiosidades/' %} class="active"{% endif %}>Viajes</a><a href="/blog/curiosidades/"{% if page.categoria == 'curiosidades' or page.url == '/blog/curiosidades/' %} class="active"{% endif %}>Curiosidades</a><a href="/">Portfolio</a><a href="/#contacto">Contacto</a></nav>
</div></header>
<main>
{{ content }}
</main>
<footer class="site-footer"><div class="wrap"><span>© {{ site.time | date: '%Y' }} Marie Peachx</span><a href="/">Volver al portfolio →</a></div></footer>
</body>
</html>
